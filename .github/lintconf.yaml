---
# Based on https://github.com/helm/chart-testing/blob/main/etc/lintconf.yaml
# Style-only rules are demoted to `level: warning` so `ct lint` only fails on
# real problems (helm lint issues, syntax errors, chart version not bumped),
# not cosmetic YAML formatting in pre-existing files.
rules:
  braces:
    level: warning
    min-spaces-inside: 0
    max-spaces-inside: 0
    min-spaces-inside-empty: -1
    max-spaces-inside-empty: -1
  brackets:
    level: warning
    min-spaces-inside: 0
    max-spaces-inside: 0
    min-spaces-inside-empty: -1
    max-spaces-inside-empty: -1
  colons:
    level: warning
    max-spaces-before: 0
    max-spaces-after: 1
  commas:
    level: warning
    max-spaces-before: 0
    min-spaces-after: 1
    max-spaces-after: 1
  comments:
    level: warning
    require-starting-space: true
    min-spaces-from-content: 2
  comments-indentation:
    level: warning
  document-end: disable
  document-start:
    level: warning
  empty-lines:
    level: warning
    max: 2
    max-start: 0
    max-end: 0
  hyphens:
    level: warning
    max-spaces-after: 1
  indentation:
    level: warning
    spaces: consistent
    indent-sequences: whatever      # - list indentation will handle both indentation and without
    check-multi-line-strings: false
  key-duplicates: enable
  line-length:
    level: warning
  new-line-at-end-of-file:
    level: warning
  new-lines:
    type: unix
  trailing-spaces:
    level: warning
  truthy:
    level: warning
